[package]
name = "dtam-viewer"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dtam-core = { path = "../dtam-core" }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
wgpu.workspace = true
pollster.workspace = true
log.workspace = true
env_logger = "0.11"
bytemuck.workspace = true
nalgebra.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dtam-video = { path = "../dtam-video" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Performance",
    "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlVideoElement",
    "HtmlMediaElement", "CanvasRenderingContext2d", "ImageData", "Navigator", "MediaDevices",
    "MediaStream", "MediaStreamTrack", "MediaStreamConstraints", "EventTarget", "Event",
    "AddEventListenerOptions", "console", "Response", "Blob", "Url",
] }
