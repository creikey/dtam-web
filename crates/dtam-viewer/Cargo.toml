[package]
name = "dtam-viewer"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
dtam-core = { path = "../dtam-core" }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
wgpu.workspace = true
pollster.workspace = true
log.workspace = true
env_logger = "0.11"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dtam-video = { path = "../dtam-video" }
